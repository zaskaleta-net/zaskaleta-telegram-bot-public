name: Telegram Webhook Secret — Guarded Rotation

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type ROTATE-TELEGRAM-WEBHOOK-SECRET'
        required: true
        type: string
      expected_active_version:
        description: 'Exact healthy Worker version from reviewed preflight (initial installation only)'
        required: true
        default: ac5e41ae-c9ae-4926-af0f-557b53708b08
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-webhook-secret-rotation
  cancel-in-progress: false

env:
  WEBHOOK_URL: https://bot.zaskaleta.net/telegram/stateless
  EXPECTED_TELEGRAM_INFO_TREE: 8cf9fd3e5d849e51f3e4e7d6b186307b4d2488f7

jobs:
  approve-staging:
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot-public' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce reviewed staging approval context
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          node telegram-info/scripts/telegram-forensic-audit.mjs

  rotate:
    needs: approve-staging
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot-public' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram-registration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce reviewed tree and exact public manual context
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          node telegram-info/scripts/telegram-forensic-audit.mjs
      - name: Coordinated installation with forward recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          EXPECTED_ACTIVE_VERSION: ${{ inputs.expected_active_version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          // Forward recovery only. No rollback can safely infer Telegram's hidden secret.
          const env = process.env;
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const webhook = 'https://bot.zaskaleta.net/telegram/stateless';
          const healthUrl = 'https://bot.zaskaleta.net/health';
          let phase = 'PREFLIGHT_UNCHANGED';
          let stage = 'INPUTS';
          let activeVersion = null;
          const deadline = Date.now() + 480000;
          function requireOk(value) { if (!value) throw new Error('CHECK_FAILED'); }
          async function request(url, options = {}) {
            const remaining = deadline - Date.now();
            requireOk(remaining > 0);
            const response = await fetch(url, { ...options, redirect:'error', signal:AbortSignal.timeout(Math.min(15000, remaining)) });
            let body = null;
            try { body = await response.json(); } catch {}
            return { status:response.status, body };
          }
          async function bounded(operation, attempts = 3, delay = 2000, budget = 600000) {
            const started = Date.now();
            for (let attempt = 0; attempt < attempts && Date.now() - started < budget; attempt += 1) {
              try { return await operation(); } catch {}
              if (attempt + 1 < attempts) await new Promise(resolve => setTimeout(resolve, delay));
            }
            throw new Error('RETRY_EXHAUSTED');
          }
          try {
            requireOk(typeof env.CLOUDFLARE_API_TOKEN === 'string' && env.CLOUDFLARE_API_TOKEN.length > 0 && !/\s/.test(env.CLOUDFLARE_API_TOKEN));
            requireOk(/^[0-9a-f]{32}$/i.test(env.CLOUDFLARE_ACCOUNT_ID || ''));
            requireOk(/^[0-9]{5,20}:[A-Za-z0-9_-]{30,256}$/.test(env.TELEGRAM_BOT_TOKEN || ''));
            requireOk(/^[A-Za-z0-9_-]{32,256}$/.test(env.TELEGRAM_WEBHOOK_SECRET || ''));
            requireOk(uuid.test(env.EXPECTED_ACTIVE_VERSION || ''));
            const cfBase = 'https://api.cloudflare.com/client/v4/accounts/' + env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/zaskaleta-info-telegram-staging';
            async function cf(path, options = {}) {
              const result = await request(cfBase + path, { ...options, headers:{ Authorization:'Bearer ' + env.CLOUDFLARE_API_TOKEN, 'Content-Type':'application/json' } });
              requireOk(result.status === 200 && result.body?.success === true);
              return result.body.result;
            }
            async function tg(method, options = {}) {
              const result = await request('https://api.telegram.org/bot' + env.TELEGRAM_BOT_TOKEN + '/' + method, options);
              requireOk(result.status === 200 && result.body?.ok === true);
              return result.body.result;
            }
            async function current() {
              const result = await cf('/deployments');
              const list = result?.deployments;
              requireOk(Array.isArray(list) && list.length > 0);
              requireOk(list.every(d => uuid.test(d?.id || '') && typeof d.created_on === 'string' && Number.isFinite(Date.parse(d.created_on))));
              list.sort((a,b) => Date.parse(b.created_on) - Date.parse(a.created_on));
              requireOk(list.length === 1 || Date.parse(list[0].created_on) > Date.parse(list[1].created_on));
              const deployment = list[0];
              requireOk(deployment.strategy === 'percentage' && Array.isArray(deployment.versions) && deployment.versions.length === 1);
              const version = deployment.versions[0];
              requireOk(version.percentage === 100 && uuid.test(version.version_id || ''));
              const health = await request(healthUrl);
              requireOk(health.status === 200 && health.body?.ok === true && health.body?.delivery === true && health.body?.versionId === version.version_id);
              return version.version_id;
            }
            async function latest() {
              const result = await cf('/versions?page=1&per_page=1');
              requireOk(Array.isArray(result?.items) && result.items.length === 1);
              requireOk(result.items.every(v => uuid.test(v?.id || '') && Number.isSafeInteger(v.number) && v.number > 0));
              const ordered = [...result.items].sort((a,b) => b.number - a.number);
              requireOk(ordered.length === 1 || ordered[0].number > ordered[1].number);
              return ordered[0].id;
            }
            function validateInfo(info) {
              requireOk(info?.url === webhook && info.has_custom_certificate === false);
              requireOk(Number.isSafeInteger(info.pending_update_count) && info.pending_update_count >= 0);
              requireOk(Number.isSafeInteger(info.max_connections) && info.max_connections >= 1 && info.max_connections <= 100);
              requireOk(Array.isArray(info.allowed_updates) && info.allowed_updates.every(v => typeof v === 'string' && /^[a-z_]{1,64}$/.test(v)));
              requireOk(['message', 'callback_query', 'chat_join_request'].every(v => info.allowed_updates.includes(v)));
              return {max_connections:info.max_connections, ...(info.allowed_updates === undefined ? {} : {allowed_updates:info.allowed_updates})};
            }
            async function probe() {
              const invalid = await request(webhook, {method:'POST', headers:{'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':'invalid-rotation-probe-secret'},body:'{}'});
              requireOk(invalid.status === 401);
              const valid = await request(webhook, {method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':env.TELEGRAM_WEBHOOK_SECRET},body:'{}'});
              requireOk(valid.status === 401 || (valid.status === 200 && valid.body?.ok === true));
              return valid.status === 200;
            }
            stage = 'BOT_IDENTITY';
            const me = await tg('getMe');
            requireOk(me?.is_bot === true && me.username === 'ZaskaletaInfoBot');
            stage = 'WEBHOOK_OPTIONS';
            const options = validateInfo(await tg('getWebhookInfo'));
            stage = 'CURRENT_DEPLOYMENT';
            activeVersion = await current();
            stage = 'EXISTING_SECRET_PROBE';
            const installed = await probe();
            if (!installed) {
              stage = 'PINNED_LATEST_VERSION';
              requireOk(activeVersion === env.EXPECTED_ACTIVE_VERSION && await latest() === activeVersion);
              // Recheck after probes; Cloudflare additionally rejects latest-not-deployed
              // with 10214/10215. Direct PUT deliberately has no draft-worker fallback.
              requireOk(await current() === activeVersion && await latest() === activeVersion);
              stage = 'CF_SECRET_UPDATE';
              phase = 'CF_UPDATE_UNKNOWN_TG_UNCHANGED';
              try {
                await cf('/secrets', {method:'PUT',body:JSON.stringify({name:'TELEGRAM_WEBHOOK_SECRET',text:env.TELEGRAM_WEBHOOK_SECRET,type:'secret_text'})});
              } catch { /* A timeout can have committed: reconcile, never assume failure. */ }
              stage = 'CF_RECONCILE';
              activeVersion = await bounded(async () => {
                const version = await current();
                requireOk(await probe());
                requireOk(await current() === version);
                return version;
              }, 60, 3000, 180000);
            }
            phase = 'CF_SECRET_CONFIRMED_TG_UNRESOLVED';
            stage = 'BEFORE_TELEGRAM';
            requireOk(await current() === activeVersion && await probe());
            // Do not overwrite webhook options changed by another operator during preflight.
            requireOk(JSON.stringify(validateInfo(await tg('getWebhookInfo'))) === JSON.stringify(options));
            stage = 'TELEGRAM_SET_WEBHOOK';
            // From the first attempt onwards, even timeout is ambiguous. Keep the new CF
            // secret and only retry the same Telegram payload. A rerun probes then skips PUT.
            await bounded(async () => {
              requireOk(await current() === activeVersion && await probe());
              requireOk(await tg('setWebhook', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:webhook,secret_token:env.TELEGRAM_WEBHOOK_SECRET,...options,drop_pending_updates:false})}) === true);
            });
            phase = 'BOTH_UPDATED_VERIFICATION_PENDING';
            stage = 'FINAL_VERIFY';
            const info = await tg('getWebhookInfo');
            requireOk(JSON.stringify(validateInfo(info)) === JSON.stringify(options));
            requireOk(await current() === activeVersion && await probe());
            console.log('TELEGRAM_WEBHOOK_ROTATION_OK ' + JSON.stringify({activeVersion,cloudflareWriteSkipped:installed,authenticatedWebhookProbe:true,invalidSecretFailClosed401:true,pendingUpdateCount:info.pending_update_count}));
          } catch {
            // Never print external response bodies, URLs, exceptions, hashes or credentials.
            console.error('TELEGRAM_WEBHOOK_ROTATION_FAILED ' + phase + ' ' + stage);
            console.error('RECOVERY_RERUN_SAME_STAGED_SECRET_AFTER_RESOLVING_FAILED_CHECK');
            process.exitCode = 1;
          }
          NODE
