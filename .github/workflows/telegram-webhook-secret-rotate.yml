name: Telegram Webhook Secret — Guarded Rotation

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type ROTATE-TELEGRAM-WEBHOOK-SECRET'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-webhook-secret-rotation
  cancel-in-progress: false

env:
  EXPECTED_TELEGRAM_INFO_TREE: 41454c5700b7c95d5f5acf2436231e66ab2237f4
  STAGING_URL: https://bot.zaskaleta.net
  WEBHOOK_URL: https://bot.zaskaleta.net/telegram/stateless

jobs:
  preflight-cloudflare:
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram-staging
    outputs:
      secret_fingerprint: ${{ steps.fingerprint.outputs.value }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce reviewed tree and validate Cloudflare-side inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          [[ "${TELEGRAM_WEBHOOK_SECRET:-}" =~ ^[A-Za-z0-9_-]{32,256}$ ]]
          echo "CLOUDFLARE_PREFLIGHT_INPUTS_OK"
      - name: Fingerprint staged secret without disclosure
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          value="$(printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Verify staging is healthy before mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(process.env.STAGING_URL + '/health', {
            redirect: 'error',
            signal: AbortSignal.timeout(15000)
          });
          const body = await response.json().catch(() => null);
          assert.equal(response.status, 200);
          assert.equal(body?.ok, true);
          assert.equal(body?.delivery, true);
          console.log('STAGING_PREFLIGHT_OK');
          NODE

  preflight-telegram:
    needs: preflight-cloudflare
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram-registration
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      EXPECTED_SECRET_FINGERPRINT: ${{ needs.preflight-cloudflare.outputs.secret_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce reviewed tree and matching environment secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          [[ "${TELEGRAM_BOT_TOKEN:-}" =~ ^[0-9]{5,20}:[A-Za-z0-9_-]{30,}$ ]]
          [[ "${TELEGRAM_WEBHOOK_SECRET:-}" =~ ^[A-Za-z0-9_-]{32,256}$ ]]
          local_fingerprint="$(printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          test "$local_fingerprint" = "$EXPECTED_SECRET_FINGERPRINT"
          echo "ROTATION_SECRET_MATCH_CONFIRMED"
      - name: Verify Telegram identity and current webhook before mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const token = String(process.env.TELEGRAM_BOT_TOKEN || '');
          async function get(method) {
            const response = await fetch('https://api.telegram.org/bot' + token + '/' + method, {
              redirect: 'error',
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.json().catch(() => null);
            assert.equal(response.status, 200);
            assert.equal(body?.ok, true);
            return body.result;
          }
          const me = await get('getMe');
          assert.equal(me?.username, 'ZaskaletaInfoBot');
          const info = await get('getWebhookInfo');
          assert.equal(info?.url, process.env.WEBHOOK_URL);
          console.log('TELEGRAM_PREFLIGHT_OK');
          NODE

  rotate-cloudflare:
    needs: [preflight-cloudflare, preflight-telegram]
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      EXPECTED_SECRET_FINGERPRINT: ${{ needs.preflight-cloudflare.outputs.secret_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate immutable rotation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          [[ "${TELEGRAM_WEBHOOK_SECRET:-}" =~ ^[A-Za-z0-9_-]{32,256}$ ]]
          local_fingerprint="$(printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          test "$local_fingerprint" = "$EXPECTED_SECRET_FINGERPRINT"
      - name: Install Wrangler
        working-directory: telegram-info
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Update Cloudflare webhook secret
        working-directory: telegram-info
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --env staging --config wrangler.jsonc
      - name: Verify Cloudflare accepts rotated secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const secret = String(process.env.TELEGRAM_WEBHOOK_SECRET || '');
          const response = await fetch(process.env.WEBHOOK_URL, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-telegram-bot-api-secret-token': secret
            },
            body: '{}',
            redirect: 'error',
            signal: AbortSignal.timeout(15000)
          });
          const body = await response.json().catch(() => null);
          assert.equal(response.status, 200);
          assert.equal(body?.ok, true);
          console.log('CLOUDFLARE_ROTATION_PROBE_OK');
          NODE

  rotate-telegram:
    needs: [preflight-cloudflare, rotate-cloudflare]
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot' && github.ref == 'refs/heads/main' && inputs.approval == 'ROTATE-TELEGRAM-WEBHOOK-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram-registration
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      EXPECTED_SECRET_FINGERPRINT: ${{ needs.preflight-cloudflare.outputs.secret_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Revalidate immutable rotation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD:telegram-info)" = "$EXPECTED_TELEGRAM_INFO_TREE"
          [[ "${TELEGRAM_BOT_TOKEN:-}" =~ ^[0-9]{5,20}:[A-Za-z0-9_-]{30,}$ ]]
          [[ "${TELEGRAM_WEBHOOK_SECRET:-}" =~ ^[A-Za-z0-9_-]{32,256}$ ]]
          local_fingerprint="$(printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          test "$local_fingerprint" = "$EXPECTED_SECRET_FINGERPRINT"
      - name: Rotate Telegram webhook secret and verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const token = String(process.env.TELEGRAM_BOT_TOKEN || '');
          const secret = String(process.env.TELEGRAM_WEBHOOK_SECRET || '');
          const webhook = process.env.WEBHOOK_URL;

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              redirect: 'error',
              signal: AbortSignal.timeout(15000)
            });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            return { response, body };
          }

          let setResult = null;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              const current = await request('https://api.telegram.org/bot' + token + '/setWebhook', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  url: webhook,
                  secret_token: secret,
                  allowed_updates: ['message', 'callback_query', 'chat_join_request'],
                  max_connections: 1,
                  drop_pending_updates: false
                })
              });
              if (current.response.status === 200 && current.body?.ok === true) {
                setResult = current;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          assert.equal(setResult?.response?.status, 200);
          assert.equal(setResult?.body?.ok, true);

          const info = await request('https://api.telegram.org/bot' + token + '/getWebhookInfo');
          assert.equal(info.response.status, 200);
          assert.equal(info.body?.ok, true);
          assert.equal(info.body?.result?.url, webhook);
          assert.equal(info.body?.result?.max_connections, 1);
          const allowed = Array.isArray(info.body?.result?.allowed_updates) ? info.body.result.allowed_updates : [];
          assert.equal(allowed.includes('message'), true);
          assert.equal(allowed.includes('callback_query'), true);
          assert.equal(allowed.includes('chat_join_request'), true);

          const invalid = await request(webhook, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-telegram-bot-api-secret-token': 'invalid-rotation-probe-secret'
            },
            body: '{}'
          });
          assert.equal(invalid.response.status, 401);

          const auth = await request(webhook, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-telegram-bot-api-secret-token': secret
            },
            body: '{}'
          });
          assert.equal(auth.response.status, 200);
          assert.equal(auth.body?.ok, true);

          console.log('TELEGRAM_WEBHOOK_ROTATION_OK ' + JSON.stringify({
            webhookConfigured: true,
            invalidSecretFailClosed401: true,
            authenticatedWebhookProbe: true,
            pendingUpdateCount: Number(info.body.result.pending_update_count || 0)
          }));
          NODE
