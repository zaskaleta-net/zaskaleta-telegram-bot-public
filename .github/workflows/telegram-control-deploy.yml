name: Telegram Control — Guarded Deploy

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DEPLOY-CONTROL to deploy only zaskaleta-cloudflare-control'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-control-deploy
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot' && inputs.approval == 'DEPLOY-CONTROL'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated control Worker
        working-directory: telegram-control
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run validate
      - name: Enforce deployment target
        working-directory: telegram-control
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const cfg = JSON.parse(raw);
          if (cfg.name !== 'zaskaleta-cloudflare-control') throw new Error('Refusing unexpected Worker name');
          if (cfg.main !== 'src/worker.mjs') throw new Error('Refusing unexpected entrypoint');
          if (raw.includes('zaskaleta-info-telegram-staging\"')) {
            // The staging URL is allowed only as TELEGRAM_WORKER_URL, never as the deployment name.
            if (cfg.name === 'zaskaleta-info-telegram-staging') throw new Error('Refusing Telegram Worker deployment target');
          }
          console.log('CONTROL_DEPLOY_TARGET_OK');
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram-control
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler without lifecycle scripts
        working-directory: telegram-control
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy isolated control Worker
        working-directory: telegram-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.jsonc --name zaskaleta-cloudflare-control

# This workflow can deploy only the isolated control Worker name.
# CONTROL_AUTH_TOKEN and TELEGRAM_BOT_TOKEN must be provisioned separately as
# Cloudflare Worker secrets; this workflow never accepts or prints their values.
