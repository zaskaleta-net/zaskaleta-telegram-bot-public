name: Telegram Token — Identity Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-token-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'zaskaleta-net/zaskaleta-telegram-bot-public' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify token belongs to ZaskaletaInfoBot
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          function fail(message) {
            console.error(message);
            process.exitCode = 1;
          }
          const token = process.env.TELEGRAM_BOT_TOKEN || '';
          if (!/^[0-9]{5,20}:[A-Za-z0-9_-]{30,256}$/.test(token)) {
            fail('TELEGRAM_TOKEN_MISSING_OR_INVALID_FORMAT');
          } else {
            try {
              const response = await fetch('https://api.telegram.org/bot' + token + '/getMe', {
                method: 'GET',
                redirect: 'error',
                signal: AbortSignal.timeout(15000)
              });
              if (response.status === 401) {
                fail('TELEGRAM_TOKEN_REJECTED');
              } else if (!response.ok) {
                fail('TELEGRAM_API_REQUEST_FAILED');
              } else {
                const body = await response.json();
                if (body?.ok !== true || body?.result?.is_bot !== true) {
                  fail('TELEGRAM_TOKEN_RESPONSE_INVALID');
                } else if (body.result.username !== 'ZaskaletaInfoBot') {
                  fail('TELEGRAM_TOKEN_WRONG_BOT');
                } else {
                  console.log('TELEGRAM_TOKEN_OK @ZaskaletaInfoBot');
                }
              }
            } catch {
              // Errors can contain the credential-bearing URL. Never log them.
              fail('TELEGRAM_TOKEN_CHECK_UNAVAILABLE');
            }
          }
          NODE
